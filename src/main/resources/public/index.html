<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Mockup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121213;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Cuadrícula de Wordle */
        .wordle-grid {
            display: grid;
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            margin-top: 20px;
        }

        .wordle-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .tile {
            width: 58px;
            height: 58px;
            border: 2px solid #3a3a3c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Estados de las celdas */
        .correct { background-color: #538d4e; border-color: #538d4e; }
        .present { background-color: #b59f3b; border-color: #b59f3b; }
        .absent  { background-color: #3a3a3c; border-color: #3a3a3c; }

        /* Estilos del teclado */
        .keyboard {
            margin-top: 50px;
            max-width: 500px;
            width: 100%;
        }

        .key-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .key {
            background-color: #818384;
            border: 0;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            padding: 15px;
            cursor: pointer;
            text-transform: uppercase;
            flex: 1;
            min-width: 30px;
        }

        .key-wide { flex: 1.5; }

        input.letter-input {
            background: transparent;
            border: none;
            color: white;
            text-align: center;
            width: 100%;
            font-size: 2rem;
            font-weight: bold;
        }

        input:focus { outline: none; }
    </style>
</head>
<body>

<header class="py-3 border-bottom border-secondary w-100 text-center">
    <h1 class="fw-bold">WORDLE</h1>
</header>

<main class="container d-flex flex-column align-items-center flex-grow-1">

    <div class="wordle-grid">
        <div class="wordle-row">
            <div class="tile absent">P</div>
            <div class="tile present">I</div>
            <div class="tile absent">Z</div>
            <div class="tile absent">Z</div>
            <div class="tile absent">A</div>
        </div>

        <div class="wordle-row">
            <div class="tile correct">G</div>
            <div class="tile correct">U</div>
            <div class="tile correct">I</div>
            <div class="tile correct">O</div>
            <div class="tile correct">N</div>
        </div>

        <div class="wordle-row">
            <div class="tile"><input type="text" class="letter-input" maxlength="1"></div>
            <div class="tile"><input type="text" class="letter-input" maxlength="1"></div>
            <div class="tile"><input type="text" class="letter-input" maxlength="1"></div>
            <div class="tile"><input type="text" class="letter-input" maxlength="1"></div>
            <div class="tile"><input type="text" class="letter-input" maxlength="1"></div>
        </div>
    </div>

    <form class="mt-4" action="">
        <input type="text" name="palabra"/>
        <input type="submit" value="enviar"/>
    </form>

    <div class="mt-4">
        <button class="btn btn-outline-light px-4">REINTENTAR</button>
    </div>

</main>

</body>
</html>
